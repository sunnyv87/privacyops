apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
type: Opaque
data:
  # REQUIRED: Override via --set secrets.jwtSecret="$(openssl rand -hex 32)"
  jwt-secret: {{ required "A valid .Values.secrets.jwtSecret is required. Generate with: openssl rand -hex 32" .Values.secrets.jwtSecret | b64enc | quote }}
