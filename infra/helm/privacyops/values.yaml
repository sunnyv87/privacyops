# TechD PrivacyOps — Helm Values

api:
  replicaCount: 3
  image:
    repository: ghcr.io/techd/privacyops-api
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  env:
    NODE_ENV: production
    PORT: "4000"

web:
  replicaCount: 2
  image:
    repository: ghcr.io/techd/privacyops-web
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

scanWorker:
  replicaCount: 2
  image:
    repository: ghcr.io/techd/privacyops-api
    tag: latest
  command: ["node", "dist/workers/scan-worker.js"]
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 20
    targetCPUUtilization: 70

temporalWorker:
  replicaCount: 2
  image:
    repository: ghcr.io/techd/privacyops-api
    tag: latest
  command: ["node", "dist/workers/temporal-worker.js"]
  resources:
    requests:
      cpu: 250m
      memory: 512Mi

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: 1m
  hosts:
    - host: api.privacyops.techd.com
      paths:
        - path: /
          service: api
    - host: app.privacyops.techd.com
      paths:
        - path: /
          service: web
  tls:
    - secretName: privacyops-tls
      hosts:
        - api.privacyops.techd.com
        - app.privacyops.techd.com

# External services (provide connection details)
postgresql:
  host: ""
  port: 5432
  database: privacyops
  existingSecret: privacyops-db-credentials

redis:
  host: ""
  port: 6379
  existingSecret: privacyops-redis-credentials

opensearch:
  host: ""
  port: 9200

nats:
  url: ""

temporal:
  address: ""

s3:
  endpoint: ""
  bucket: privacyops-data
  region: ap-south-1
  existingSecret: privacyops-s3-credentials

# Observability
observability:
  prometheus:
    serviceMonitor:
      enabled: true
      interval: "15s"
      scrapeTimeout: "10s"
    rules:
      enabled: true
  tracing:
    enabled: true
    endpoint: "http://jaeger-collector:4318"
    serviceName: "privacyops-api"
    samplingRate: 0.1
