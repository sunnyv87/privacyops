global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'privacyops-api'
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ['host.docker.internal:4000']
        labels:
          service: 'privacyops-api'

  - job_name: 'nats'
    metrics_path: /metrics
    static_configs:
      - targets: ['nats:8222']
        labels:
          service: 'nats'
